name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test / scan / build (macOS)
    runs-on: macos-14
    steps:
      # actions/checkout v7.0.1, pinned by commit SHA
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # actions/setup-python v7.0.0, pinned by commit SHA
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install package and build tooling
        run: python -m pip install --upgrade pip wheel && python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Byte-compile check
        run: python -m compileall -q hermes_imsg_cli tests scripts

      - name: Shell script syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: Validate static release site
        run: python scripts/validate_site.py

      - name: Privacy/security scan
        run: python scripts/privacy_scan.py

      - name: Diff hygiene (whitespace errors) on PR changes
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist

      - name: Upload wheel artifact
        # actions/upload-artifact v7.0.1, pinned by commit SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hermes-imsg-cli-wheel
          path: dist/*.whl
          if-no-files-found: error
